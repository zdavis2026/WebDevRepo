<!DOCTYPE html>
<html lang="en">
<head>
<title>New Form</title>
<meta charset="utf-8">
</head>
<body>
<h1>Signup Form</h1>
<input type="hidden" name="userid" id="userid" value="useridvalue">
<form method="post" action="https://webdevbasics.net/scripts/demo.php">
<label for="username">Username:</label>
<input type="text" name="username" id="username" maxlength="30"><br>
<label for="password">Password:</label>
<input type="password" name="pword" id="pword" maxlength="20"><br><br>
Favorite Day of the Week:<br>
<input type="radio" name="favday" id="favday" value="Monday">Monday<br>
<input type="radio" name="favday" id="favday" value="Tuesday">Tuesday<br>
<input type="radio" name="favday" id="favday" value="Wednesday">Wednesday<br>
<input type="radio" name="favday" id="favday" value="Thursday">Thursday<br>
<input type="radio" name="favday" id="favday" value="Friday">Friday<br>
<input type="radio" name="favday" id="favday" value="Saturday">Saturday<br>
<input type="radio" name="favday" id="favday" value="Sunday">Sunday<br><br>
<select size="1" name="favsocmedia" id="favsocmedia">
    <option>Select your favorite social media site</option>
    <option value="x">X/Twitter</option>
    <option value="facebook">Facebook</option>
    <option value="instagram">Instagram</option>
    <option value="reddit">Reddit</option>
</select><br><br>
<fieldset><legend>Shipping Address</legend>
    <label>Address Line 1: <input type="text" name="addressl1" id="addressl1"></label>
    <label>Address Line 2: <input type="text" name="addressl2" id="addressl2"></label><br>
    <label>City: <input type="text" name="city" id="city"></label>
    <label>State: <input type="text" name="state" id="state"></label>
    <label>Zip: <input type="text" name="zip" id="zip"></label>
</fieldset>
<input type="image" src="signup.gif" alt="Signup Button">
</form>
</body>
</html>
